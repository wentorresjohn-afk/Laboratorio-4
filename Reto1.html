    button {
      font-size: 20px;       
      padding: 15px 30px;   
      cursor: pointer;       
      border-radius: 8px;    
      border: none;
      background-color: darkblue;

      background-color: navy;

<body>
  <h2>Programa de saludo</h2>
  <button onclick="pedirNombre()">Haz clic aquí</button>

  <script>
    function pedirNombre() {
      let nombre = prompt("Por favor, ingresa tu nombre:");
      if (nombre && nombre.trim() !== "") {
        alert("¡Hola, " + nombre + "!");
      } else {
        alert("No ingresaste ningún nombre.");
      }
    }
  </script>
</body>
